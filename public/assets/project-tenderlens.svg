<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="radial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bg)"/>
  <circle cx="300" cy="160" r="140" fill="url(#radial)"/>
  <!-- Grid Lines -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="360"/>
    <line x1="180" y1="0" x2="180" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="420" y1="0" x2="420" y2="360"/>
    <line x1="540" y1="0" x2="540" y2="360"/>
    <line x1="0" y1="90" x2="600" y2="90"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="270" x2="600" y2="270"/>
  </g>
  <!-- Document & Lens Icon -->
  <g transform="translate(230, 80)">
    <!-- Document Card -->
    <rect x="10" y="10" width="100" height="130" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="28" y1="35" x2="90" y2="35" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="28" y1="55" x2="80" y2="55" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="28" y1="75" x2="92" y2="75" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <line x1="28" y1="95" x2="65" y2="95" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <!-- Analytics Lens -->
    <circle cx="85" cy="110" r="32" fill="#0f172a" stroke="#818cf8" stroke-width="3"/>
    <circle cx="85" cy="110" r="24" fill="#38bdf8" fill-opacity="0.15"/>
    <line x1="108" y1="133" x2="132" y2="157" stroke="#818cf8" stroke-width="4" stroke-linecap="round"/>
    <!-- AI spark -->
    <path d="M85 96 L87 106 L97 108 L87 110 L85 120 L83 110 L73 108 L83 106 Z" fill="#38bdf8"/>
  </g>
  <!-- Title Badge -->
  <rect x="200" y="275" width="200" height="34" rx="17" fill="rgba(15,23,42,0.8)" stroke="rgba(56,189,248,0.4)" stroke-width="1"/>
  <text x="300" y="297" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="700" font-size="14" text-anchor="middle" letter-spacing="1">TENDERLENS AI</text>
  <text x="300" y="328" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle" letter-spacing="2">PROCUREMENT INTELLIGENCE</text>
</svg>
